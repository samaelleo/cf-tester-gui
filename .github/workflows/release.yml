name: Automated Multi-Platform Release (.exe, .deb, .dmg)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom release tag (optional, e.g. v1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  # =========================================================================
  # 1. Automatic Semantic Versioning & Tag Generation
  # =========================================================================
  version-tag:
    name: Generate Semantic Version
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.gen_tag.outputs.tag_name }}
      version: ${{ steps.gen_tag.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Version & Tag
        id: gen_tag
        run: |
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            TAG="${{ github.event.inputs.custom_tag }}"
            VER="${TAG#v}"
          else
            # Automated incremental semantic version based on build run
            VER="1.0.${{ github.run_number }}"
            TAG="v${VER}"
          fi
          echo "Generated tag: ${TAG}"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT

  # =========================================================================
  # 2. Multi-Platform Binary Builder Matrix (Windows, Linux, macOS)
  # =========================================================================
  build:
    name: Build (${{ matrix.os }})
    needs: version-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 Build
          - os: windows-latest
            platform: windows
            asset_ext: exe

          # Linux amd64 Build (.deb & .tar.gz)
          - os: ubuntu-latest
            platform: linux
            asset_ext: deb

          # macOS Universal Build (.dmg & .zip)
          - os: macos-latest
            platform: macos
            asset_ext: dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev libwebkit2gtk-4.1-dev dpkg-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Test Suite
        run: |
          python test_suite.py

      # --- Build on Windows (.exe & .zip) ---
      - name: Build Windows Executable
        if: matrix.platform == 'windows'
        run: |
          python build.py
          Move-Item -Path "dist/cf-clean-ip-scanner.exe" -Destination "dist/cf-clean-ip-scanner-windows-x64.exe"
          Compress-Archive -Path "dist/cf-clean-ip-scanner-windows-x64.exe" -DestinationPath "dist/cf-clean-ip-scanner-windows-x64.zip"

      # --- Build on Linux (.deb & .tar.gz) ---
      - name: Build Linux Executable & Debian Package
        if: matrix.platform == 'linux'
        run: |
          python3 build.py
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh "${{ needs.version-tag.outputs.version }}"
          tar -czvf dist/cf-clean-ip-scanner-linux-x64.tar.gz -C dist cf-clean-ip-scanner

      # --- Build on macOS (.dmg & .zip) ---
      - name: Build macOS Application & DMG Package
        if: matrix.platform == 'macos'
        run: |
          python3 build.py
          chmod +x scripts/build_dmg.sh
          ./scripts/build_dmg.sh "${{ needs.version-tag.outputs.version }}"
          ditto -c -k --sequesterRsrc --keepParent dist/cf-clean-ip-scanner.app dist/cf-clean-ip-scanner-macos.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.deb
            dist/*.tar.gz
            dist/*.dmg
          retention-days: 5

  # =========================================================================
  # 3. Android APK Builder & Verification Job
  # =========================================================================
  build-android:
    name: Build Android APK
    needs: version-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Run Android JVM Unit Tests
        run: ./android/gradlew -p android testDebugUnitTest

      - name: Download Xray Android Binaries
        run: ./android/gradlew -p android downloadXrayBinaries

      - name: Build Android APK (Release & Debug)
        run: |
          ./android/gradlew -p android assembleRelease || ./android/gradlew -p android assembleDebug
          mkdir -p dist
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/cf-clean-ip-scanner-android-${{ needs.version-tag.outputs.version }}.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/cf-clean-ip-scanner-android-${{ needs.version-tag.outputs.version }}.apk
          else
            ./android/gradlew -p android assembleDebug
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/cf-clean-ip-scanner-android-${{ needs.version-tag.outputs.version }}.apk
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-android
          path: dist/*.apk
          retention-days: 5

  # =========================================================================
  # 4. Publish to GitHub Releases with Automated Tagging
  # =========================================================================
  release:
    name: Publish GitHub Release
    needs: [version-tag, build, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: List Artifacts for Verification
        run: |
          ls -la dist-all/

      - name: Create GitHub Release and Attach Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-tag.outputs.tag_name }}
          name: Release ${{ needs.version-tag.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-all/*.exe
            dist-all/*.zip
            dist-all/*.deb
            dist-all/*.tar.gz
            dist-all/*.dmg
            dist-all/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
